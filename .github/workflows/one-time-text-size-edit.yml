name: One-time Text Size Edit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change Text Size maximum to 80px
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("packages/ui/src/components/settings/LiveViewTab.tsx")
          s = p.read_text(encoding="utf-8")
          old = '''                    min="10"\n                    max="28"\n                    value={channelInfoOverlayFontSize}'''
          new = '''                    min="10"\n                    max="80"\n                    value={channelInfoOverlayFontSize}'''
          assert s.count(old) == 1, f"Expected exactly one target, found {s.count(old)}"
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/src/components/settings/LiveViewTab.tsx
          git commit -m "Increase overlay text size limit to 80px"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-text-size-edit.yml
          git add .github/workflows/one-time-text-size-edit.yml
          git commit -m "Remove one-time text size edit workflow" || true
          git push || true
