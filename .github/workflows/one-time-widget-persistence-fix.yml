name: One-time Widget Persistence Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix widget settings initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("packages/ui/src/stores/settingsStore.ts")
          s = p.read_text(encoding="utf-8")
          replacements = {
              "  widgetScale: 1,": "  widgetScale: (cachedSettings?.widgetScale as number) ?? 1,",
              "  widgetBgOpacity: 0.55,": "  widgetBgOpacity: (cachedSettings?.widgetBgOpacity as number) ?? 0.55,",
              "  sportsScale: 1,": "  sportsScale: (cachedSettings?.sportsScale as number) ?? 1,",
              "  sportsBgOpacity: 0.7,": "  sportsBgOpacity: (cachedSettings?.sportsBgOpacity as number) ?? 0.7,",
          }
          for old, new in replacements.items():
              assert s.count(old) == 1, f"Expected exactly one target for {old!r}, found {s.count(old)}"
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-widget-persistence-fix.yml
          git add packages/ui/src/stores/settingsStore.ts .github/workflows/one-time-widget-persistence-fix.yml
          git commit -m "Persist widget and sports overlay settings across restart"
          git push
